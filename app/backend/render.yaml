services:
  - type: web
    name: cohortiva-backend
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn Backend.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: cohortiva-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false

databases:
  - name: cohortiva-db
    databaseName: cohortiva
    user: cohortiva
